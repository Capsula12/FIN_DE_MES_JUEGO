<script>
// ============================================================ constantes
const OW = 1080, OH = 1920, W = 270, H = 480;
const FONT = '"Press Start 2P", monospace';
const COL = { hi:'#ffe135', red:'#ff4d4d', green:'#3ddc84', mut:'#9aa3b5', ml:'#ffe600', mlText:'#2d3277', nar:'#ff7a00' };

const DATA = { personasJul:5740129, personasAgo:5761876, deudaJul:26.8, deudaAgo:27.0 };
// ============================================================ lienzos
const c = document.getElementById('c'); c.width = OW; c.height = OH;
const ctx = c.getContext('2d');
// La tipografía pixel achica las mayúsculas con tilde (se ven como minúsculas): se dibuja la
// letra normal y el tilde aparte, encima.
const ACC = { 'Á': 'A', 'É': 'E', 'Í': 'I', 'Ó': 'O', 'Ú': 'U' };
for (const fn of ['fillText', 'strokeText']) {
  const orig = ctx[fn].bind(ctx);
  ctx[fn] = (text, x, y) => {
    text = String(text);
    if (!/[ÁÉÍÓÚ]/.test(text)) return orig(text, x, y);
    const base = text.replace(/[ÁÉÍÓÚ]/g, ch => ACC[ch]);
    orig(base, x, y);
    const wAll = ctx.measureText(base).width, adv = wAll / base.length, u = parseFloat(ctx.font.match(/([\d.]+)px/)[1]) / 8;
    const x0 = ctx.textAlign === 'center' ? x - wAll / 2 : ctx.textAlign === 'right' ? x - wAll : x;
    [...text].forEach((ch, i) => {
      if (!ACC[ch]) return;
      const cx = x0 + i * adv + adv * .5;
      for (const [rx, ry] of [[cx, y - 10 * u], [cx - u, y - 9 * u]]) {
        if (fn === 'fillText') ctx.fillRect(rx, ry, 2 * u, u); else ctx.strokeRect(rx, ry, 2 * u, u);
      }
    });
  };
}
const wc = document.createElement('canvas'); wc.width = W; wc.height = H;
let w = wc.getContext('2d');
const wctx = w;
const tmp = document.createElement('canvas'); tmp.width = 60; tmp.height = 60;
const tctx = tmp.getContext('2d');
// dibuja una figura al doble de tamaño: fn dibuja con ancla en (30, 50)
function big(fn, ax, ay, s = 2) {
  tctx.clearRect(0, 0, 60, 60); w = tctx; fn(30, 50); w = wctx;
  w.imageSmoothingEnabled = false; w.drawImage(tmp, Math.round(ax - 30 * s), Math.round(ay - 50 * s), 60 * s, 60 * s);
}

// ============================================================ utilidades
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const ease = k => k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
const seg = (t, a, b) => ease(clamp((t - a) / (b - a), 0, 1));
const win = (t, a, b, f = .25) => Math.min(seg(t, a, a + f), 1 - seg(t, b - f, b));
const fmtInt = n => Math.round(n).toLocaleString('es-AR');
const fmtPct = v => v.toFixed(1).replace('.', ',') + '%';
function rand(i) { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
const blink = (t, hz = 3) => Math.floor(t * hz) % 2 === 0;

// dibuja un sprite con ancla en el centro de los pies
function spr(rows, ax, ay, o = {}) {
  const sc = o.scale || 2, g = o.ctx || w, pal = Object.assign({}, SPR_PAL, o.pal || {});
  if (o.blink) pal.w = pal.e = pal.S;
  const wd = rows[0].length, x0 = Math.round(ax - wd * sc / 2), y0 = Math.round(ay - rows.length * sc);
  rows.forEach((r, j) => {
    for (let i = 0; i < wd; i++) {
      const ch = r[o.flip ? wd - 1 - i : i];
      if (ch === '.') continue;
      g.fillStyle = pal[ch]; g.fillRect(x0 + i * sc, y0 + j * sc, sc, sc);

}
const kidPal = shirt => ({ g: shirt, G: shade(shirt, -40), c: shade(shirt, 50), h: '#2b1a0e', H: '#4a2e18', m: '#c0605a' });
function shade(hex, d) {
  const n = parseInt(hex.slice(1), 16);
  const f = v => Math.max(0, Math.min(255, v + d)).toString(16).padStart(2, '0');
  return '#' + f(n >> 16) + f((n >> 8) & 255) + f(n & 255);
}
function momStand(x, feet, dir = 1, reach = false, t = 0, sc = 2) {

function momSit(x, feet, dir = 1, phone = false, t = 0, sc = 2) {

}
function kidSitFloor(x, floor, shirt, t, ph = 0, sc = 2) {

}

// ============================================================ escenarios
function stars(col = '#fff', n = 40, yMax = 200) { for (let i = 0; i < n; i++) if (rand(i * 3) > .3) R(rand(i) * W, rand(i + 50) * yMax, 1, 1, col); }

function livingRoom(t, opt = {}) {

  R(152, 256, 10, 12, '#8a4b2a'); disc(157, 250, 6, '#2e8b57'); disc(153, 246, 4, '#3fa56a'); disc(161, 245, 4, '#3fa56a');

  // sillón

  R(44, 258, 4, 8, '#3e2a1d'); R(132, 258, 4, 8, '#3e2a1d');
  momSit(88, 258, 1, opt.phone, t);

}

function kitchen(t, opt = {}) {

  R(0, 0, W, H, '#14132a');
  R(0, 100, W, 170, night ? '#1f1c33' : '#3b3552');

  R(0, 270, W, 110, night ? '#2a2a33' : '#5b5b66');
  for (let x = 0; x < W; x += 16) R(x, 270, 1, 110, night ? '#24242c' : '#52525c');
  // ventana
  R(150, 125, 55, 42, '#6b5a4a'); R(153, 128, 49, 36, night ? '#0b1030' : '#6fb7ff'); R(177, 128, 1, 36, '#6b5a4a');
  if (night) disc(165, 138, 4, '#fff1c1');
  // alacenas y mesada
  R(70, 112, 70, 28, night ? '#3a2a24' : '#6b4a3a'); R(104, 112, 1, 28, night ? '#2a1e1a' : '#553a2d');
  R(86, 124, 4, 2, '#caa'); R(118, 124, 4, 2, '#caa');

    R(62, 150, Math.round(18 * open), 118, '#a9aab0');               // puerta abierta

  }

    R(190, 100, 1, 40, '#555'); R(182, 140, 18, 6, '#ffcf6b');
    w.globalAlpha = .15; R(130, 146, 120, 90, '#ffcf6b'); w.globalAlpha = 1;
  }
}

const BLD = { x: 70, y: 112, w: 130, cols: 6, rows: 11 };
const MOMWIN = { i: 2, j: 7 };
const winRect = (i, j) => ({ x: BLD.x + 6 + i * 21, y: BLD.y + 8 + j * 18, w: 12, h: 11 });
function ringFrac(t) { return lerp(.08, .55, seg(t, 1.2, 4)); }
function sceneCity(t) {
  R(0, 0, W, H, '#0b1030'); stars('#fff', 60, 330);
  disc(230, 70, 9, '#fff1c1');
  const side = [[0, 200, 60, 12], [210, 170, 60, 14], [-10, 250, 40, 8], [245, 230, 40, 8]];
  for (const [x, y, ww, n] of side) {
    R(x, y, ww, 400, '#23273d');
    for (let j = 0; j < n; j++) for (let i = 0; i < Math.floor(ww / 14); i++) {
      const id = x * 7 + i * 31 + j * 13;
      const ringing = rand(id) < ringFrac(t);
      R(x + 4 + i * 14, y + 6 + j * 14, 7, 8, ringing ? (blink(t + rand(id), 4) ? '#ff4d4d' : '#ffec27') : (rand(id + 1) > .5 ? '#ffec27' : '#151a2e'));
    }
  }
  R(BLD.x, BLD.y, BLD.w, 400, '#3a3f58'); R(BLD.x - 4, BLD.y - 4, BLD.w + 8, 6, '#2c3048');
  for (let j = 0; j < BLD.rows; j++) for (let i = 0; i < BLD.cols; i++) {
    const r = winRect(i, j), id = i * 11 + j * 7 + 3;
    const mine = i === MOMWIN.i && j === MOMWIN.j;
    const ringing = mine || rand(id) < ringFrac(t);
    R(r.x, r.y, r.w, r.h, ringing ? '#ffec27' : (rand(id + 2) > .55 ? '#e8c547' : '#151a2e'));
    if (ringing && !mine && blink(t + rand(id), 4)) R(r.x + 4, r.y + 3, 4, 5, '#ff4d4d');
  }
  const m = winRect(MOMWIN.i, MOMWIN.j);
  R(m.x + 3, m.y + 5, 5, 6, PAL.momShirt); R(m.x + 4, m.y + 1, 3, 4, PAL.skin); R(m.x + 3, m.y, 5, 1, PAL.hair);
  R(m.x + 8, m.y + 3 + (blink(t, 8) ? 1 : 0), 2, 3, '#111');
  R(0, 380, W, 100, '#10131f');
  const A = { x: m.x + m.w / 2, y: m.y + m.h / 2, z: 6 };
  CAM = camLerp(A, VIEW, seg(t, .2, 2));
}

  R(131, 138, 8, 10, '#6fa38c'); R(134, 128, 2, 10, '#555');
  R(136, 128, 10, 2, '#75aadb'); R(136, 130, 10, 2, '#fff'); R(136, 132, 10, 2, '#75aadb');

}
function setFont(size) { ctx.font = `${size}px ${FONT}`; ctx.textBaseline = 'alphabetic'; }
function outlined(text, x, y, size, color, align = 'center', stroke = 8) {
  setFont(size); ctx.textAlign = align;
  ctx.lineJoin = 'round'; ctx.lineWidth = stroke; ctx.strokeStyle = '#000'; ctx.strokeText(text, x, y);
  ctx.fillStyle = color; ctx.fillText(text, x, y);
}
function plain(text, x, y, size, color, align = 'center') { setFont(size); ctx.textAlign = align; ctx.fillStyle = color; ctx.fillText(text, x, y); }
function richWrap(text, size, maxW) {
  setFont(size);
  const sp = ctx.measureText(' ').width;
  let hi = false; const lines = []; let line = [], lw = 0;
  for (const word of text.split(' ')) {
    const parts = []; let cur = '';
    for (const ch of word) { if (ch === '*') { if (cur) parts.push({ s: cur, hi }); cur = ''; hi = !hi; } else cur += ch; }
    if (cur) parts.push({ s: cur, hi });
    const ww = parts.reduce((a, p) => a + ctx.measureText(p.s).width, 0);
    if (line.length && lw + sp + ww > maxW) { lines.push({ parts: line, w: lw }); line = []; lw = 0; }
    if (line.length) { line.push({ s: ' ', hi: false }); lw += sp; }
    line.push(...parts); lw += ww;
  }
  if (line.length) lines.push({ parts: line, w: lw });
  return lines;
}
function drawBox(x, y, bw, bh, alpha = 1, border = '#fff') {
  ctx.globalAlpha = alpha;
  ctx.fillStyle = 'rgba(0,0,0,.9)'; ctx.fillRect(x, y, bw, bh);
  ctx.strokeStyle = border; ctx.lineWidth = 6; ctx.strokeRect(x + 3, y + 3, bw - 6, bh - 6);
  ctx.globalAlpha = 1;
}
const BOX_Y = 1240;   // cuadro de diálogo, abajo, como en los juegos de rol
function say(t, t0, t1, text, opt = {}) {
  if (t < t0 || t > t1) return;
  const size = opt.size || 38, y = opt.y ?? BOX_Y;
  const a = win(t, t0, t1, .2);
  const lines = richWrap(text, size, OW - 200);

// ============================================================ estado y lógica
const G = { id: 'title', enter: 0, textT0: 0, tried: new Set(), sel: 0, pop: null, fade: -9, stats: { hel: 0, sue: 0, deu: 0 },
  target: { hel: 0, sue: 0, deu: 0 }, muted: false, deniedAt: {}, blips: 0 };
const now = () => performance.now() / 1000;
const key = (o, id = G.id) => id + ':' + o.txt;
const exhausts = o => o.fail || o.deny || (o.msg && !o.go);
const isOff = o => exhausts(o) && G.tried.has(key(o));
function visibleOpts(scr = SCREENS[G.id]) {
  const allTried = scr.opts.filter(o => !o.hidden && exhausts(o)).every(o => G.tried.has(key(o, Object.keys(SCREENS).find(k => SCREENS[k] === scr))));
  return scr.opts.filter(o => !o.hidden || allTried);
}
function selectedTxt() { const v = visibleOpts(); return v[G.sel] ? v[G.sel].txt : ''; }
function textDone(t) { return (t - G.textT0) * 55 >= plainLen(SCREENS[G.id].text); }
const plainLen = s => s.replace(/\*/g, '').length;
function firstEnabled() { const v = visibleOpts(); const i = v.findIndex(o => !isOff(o)); return i < 0 ? 0 : i; }

function go(id, opt = {}) {
  if (opt.reset) { G.tried.clear(); G.stats = { hel: 0, sue: 0, deu: 0 }; }
  G.id = id; G.enter = now(); G.textT0 = now() + .25; G.fade = now(); G.blips = 0;
  const scr = SCREENS[id];
  if (scr.hud) G.target = { ...scr.hud };
  G.sel = firstEnabled();
  setSong(scr.song);
  if (scr.enter && AC) scr.enter();
}
function popup(text, then) { G.pop = { text, then, t0: now() }; }
function activate(o) {
  if (isOff(o)) { SFX.buzz(); return; }
  const scr = SCREENS[G.id], before = visibleOpts().length;
  const after = () => {
    const v = visibleOpts();
    if (v.length > before) { SFX.unlock(); G.sel = v.length - 1; } else G.sel = firstEnabled();
  };
  if (o.share) { share(); return; }
  if (o.deny) { G.tried.add(key(o)); G.deniedAt[key(o)] = now(); SFX.buzz(); after(); return; }
  if (o.fail) { G.tried.add(key(o)); SFX.fail(); popup(o.fail, after); return; }
  if (o.msg) {
    SFX.select();
    if (!o.go) G.tried.add(key(o));
    popup(o.msg, () => { if (o.go) go(o.go, o); else after(); });
    return;
  }
  if (o.go) { SFX.select(); go(o.go, o); }
}

  } catch (e) { popup('Copiá el link de la barra del navegador y pasalo.', null); }
}

    });

  setFont(32); ctx.textAlign = 'left';
  lines.forEach((ln, i) => {
    let x = OW / 2 - ln.w / 2; const yy = y + 70 + i * 50;
    for (const q of ln.parts) {
      if (budget <= 0) break;
      const s = q.s.length > budget ? q.s.slice(0, budget) : q.s; budget -= q.s.length;
      ctx.fillStyle = q.hi ? COL.hi : '#fff'; ctx.fillText(s, x, yy); x += ctx.measureText(q.s).width;
    }
  });
  if (budget > 0 && blink(t, 2)) triSide(OW / 2, y + h - 40, 16, true, COL.hi);
}
function popDone(t) { return G.pop && (t - G.pop.t0) * 60 >= plainLen(G.pop.text); }

function drawHUD(scr, lt) {
  for (const k in G.stats) G.stats[k] += (G.target[k] - G.stats[k]) * .08;
  if (!scr.hud) return;
  ctx.fillStyle = 'rgba(0,0,0,.8)'; ctx.fillRect(30, 20, 900, 210);
  if (scr.day) plain(scr.day, 60, 62, 20, COL.hi, 'left');
  const row = (y, label, v, col, extra) => {
    plain(label, 60, y, 22, '#fff', 'left');
    for (let i = 0; i < 10; i++) { ctx.fillStyle = i < Math.round(v) ? col : '#2a2a38'; ctx.fillRect(300 + i * 44, y - 24, 36, 28); }
    if (extra) plain(extra, 910, y, 18, col, 'right');
  };
  const hel = G.stats.hel, deu = G.stats.deu;
  row(114, 'HELADERA', hel, hel < .5 ? (blink(lt, 3) ? COL.red : '#5a1a1a') : COL.green, hel < .5 ? 'VACÍA' : '');
  row(160, 'SUELDO', G.stats.sue, '#6fb7ff', '');
  row(206, 'DEUDA', deu, COL.red, scr.mora && blink(lt, 3) ? 'MORA' : '');
}
function drawMute() {
  const x = 985, y = 50;
  ctx.fillStyle = G.muted ? '#666' : '#fff';
  ctx.fillRect(x - 24, y - 10, 14, 20); ctx.beginPath(); ctx.moveTo(x - 10, y - 10); ctx.lineTo(x + 6, y - 24); ctx.lineTo(x + 6, y + 24); ctx.lineTo(x - 10, y + 10); ctx.fill();
  if (G.muted) { ctx.strokeStyle = COL.red; ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(x + 14, y - 14); ctx.lineTo(x + 38, y + 14); ctx.moveTo(x + 38, y - 14); ctx.lineTo(x + 14, y + 14); ctx.stroke(); }
  else { ctx.fillRect(x + 14, y - 12, 5, 24); ctx.fillRect(x + 26, y - 20, 5, 40); }
}

// ============================================================ bucle principal
let lastRing = -1;
function frame() {
  const t = now(), scr = SCREENS[G.id], lt = t - G.enter;
  scr.world(lt);
  ctx.imageSmoothingEnabled = false;
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, OW, OH);
  const sw = W / CAM.z, sh = H / CAM.z;
  ctx.drawImage(wc, CAM.x - sw / 2, CAM.y - sh / 2, sw, sh, 0, VIEW_DY, OW, OH);
  scanlines();
  if (scr.over) scr.over(lt);
  drawHUD(scr, lt);
  drawTextBox(t);
  drawPopup(t);
  drawMute();
  if (G.id === 'mora' && AC && !G.muted) { const n = Math.floor(lt / 2.4); if (n !== lastRing && (lt % 2.4) < 1.5) { lastRing = n; SFX.ring(); } }
  const f = t - G.fade; if (f < .3) { ctx.fillStyle = `rgba(0,0,0,${1 - f / .3})`; ctx.fillRect(0, 0, OW, OH); }
  requestAnimationFrame(frame);
}

// ============================================================ entrada (toque, mouse, teclado)
function startAudio() { if (!AC) { initAudio(); setSong(SCREENS[G.id].song); } if (AC.state !== 'running') AC.resume(); }
function toCanvas(e) { const r = c.getBoundingClientRect(); return { x: (e.clientX - r.left) * OW / r.width, y: (e.clientY - r.top) * OH / r.height }; }
function press(p) {
  const t = now();
  startAudio();
  if (p && p.x > 930 && p.y < 110) { toggleMute(); return; }
  if (G.pop) {
    if (!popDone(t)) { G.pop.t0 = -1e9; return; }
    const then = G.pop.then; G.pop = null; SFX.menu(); if (then) then(); return;
  }
  if (!textDone(t)) { G.textT0 = -1e9; return; }
  if (p) {
    const h = HITS.find(h => p.x >= h.x && p.x <= h.x + h.w && p.y >= h.y && p.y <= h.y + h.h);
    if (h) { G.sel = h.i; activate(visibleOpts()[h.i]); }
    return;
  }
  const o = visibleOpts()[G.sel]; if (o) activate(o);
}
function move(d) {
  const v = visibleOpts(); if (!v.length || G.pop) return;
  G.sel = (G.sel + d + v.length) % v.length; SFX.menu();
}
function toggleMute() { G.muted = !G.muted; if (AC) { master.gain.value = G.muted ? 0 : .17; musicGain.gain.value = G.muted ? 0 : MUSIC_VOL; } }
c.addEventListener('pointerdown', e => { e.preventDefault(); press(toCanvas(e)); });
c.addEventListener('pointermove', e => {
  if (e.pointerType !== 'mouse' || G.pop) return;
  const p = toCanvas(e), h = HITS.find(h => p.x >= h.x && p.x <= h.x + h.w && p.y >= h.y && p.y <= h.y + h.h);
  if (h && h.i !== G.sel) { G.sel = h.i; SFX.menu(); }
  c.style.cursor = h || (p.x > 930 && p.y < 110) ? 'pointer' : 'default';
});
document.addEventListener('keydown', e => {
  if (['ArrowDown', 'ArrowRight', 's'].includes(e.key)) { e.preventDefault(); startAudio(); move(1); }
  else if (['ArrowUp', 'ArrowLeft', 'w'].includes(e.key)) { e.preventDefault(); startAudio(); move(-1); }
  else if (['Enter', ' '].includes(e.key)) { e.preventDefault(); press(null); }
  else if (e.key === 'm' || e.key === 'M') toggleMute();
});

// ============================================================ audio: efectos y música en bucle
const MUSIC_VOL = .14;
let AC = null, master = null, musicGain = null, SCHED = 0;
function initAudio() {
  AC = new (window.AudioContext || window.webkitAudioContext)();
  master = AC.createGain(); master.gain.value = .17; master.connect(AC.destination);
  musicGain = AC.createGain(); musicGain.gain.value = MUSIC_VOL; musicGain.connect(AC.destination);
}
const now0 = () => AC.currentTime + SCHED;
let song = null, nextStep = 0, stepIdx = 0;
function setSong(name) {
  if (!AC || song === name) { song = name; return; }
  song = name; stepIdx = 0; nextStep = AC.currentTime + .08;
}
setInterval(() => {
  if (!AC || !song || G.muted) return;
  const sg = SONGS[song], step = 60 / sg.bpm / 2;
  if (nextStep < AC.currentTime) nextStep = AC.currentTime + .02;
  while (nextStep < AC.currentTime + .2) {
    SCHED = nextStep - AC.currentTime;
    const L = sg.lead[stepIdx % sg.lead.length], B = sg.bass[stepIdx % sg.bass.length], D = sg.drum[stepIdx % sg.drum.length];
    const A = sg.arp ? sg.arp[stepIdx % sg.arp.length] : null;
    if (L) leadNote(midi(L), step * .9);
    if (A) arpNote(midi(A), step * .6);
    if (B) bassNote(midi(B), step * 1.8);
    if (D !== '.') drum(D);
    SCHED = 0; nextStep += step; stepIdx++;
  }
}, 25);
function arpNote(f, d) {
  const t0 = now0(), o = AC.createOscillator(), g = AC.createGain();
  o.type = 'square'; o.frequency.setValueAtTime(f, t0);
  g.gain.setValueAtTime(.09, t0); g.gain.exponentialRampToValueAtTime(.001, t0 + d);
  o.connect(g); g.connect(musicGain); o.start(t0); o.stop(t0 + d + .02);
}
Object.assign(SFX, {
  blip()   { tone(1100 + Math.random() * 200, .025, 'square', .05); },
  fail()   { noise(.45, .35, 0, 180); tone(160, .45, 'sawtooth', .18, 0, 60); },
  unlock() { [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, .09, 'square', .18, i * .06)); }
});

// ============================================================ arranque
const startGame = () => { go('title'); requestAnimationFrame(frame); };
document.fonts.load(`40px ${FONT}`).then(startGame, startGame);

</script>
</body>
